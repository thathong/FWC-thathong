<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 05 - Tab</title>
    <style>
        table {
            /* Removes the gap between cell borders */
            border-collapse: collapse; 
            width: 100%;
            height: 200px;
            border: 1px solid black;
        }

        .left-cell {
            background-color: #c2c984; /* Olive green shade */
            width: 50%;
            padding: 20px;
            border: 1px solid #777;
        }

        .right-cell {
            background-color: #f7c1ad; /* Peach/Salmon shade */
            width: 50%;
            padding: 20px;
            border: 1px solid #777;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="left-cell">First cell</td>
            <td class="right-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
